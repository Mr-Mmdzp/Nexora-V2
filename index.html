<!DOCTYPE html>
<html lang='fa' dir="rtl">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Nexora</title>
    <link rel="icon" type="image/png" href="./Assists/Screenshot 2026-08-29 140414.png">
    <link rel='stylesheet' href='style.css'>
</head>
<body>
    <div class="inventory-popup">
        <div class="title-inventory">
        <strong class="inventory-title">محصولات شما:</strong><span class="close-btn" >X</span>
        </div>

        <div class="inventory-items"></div>
    </div>
    <canvas id="digitalCanvas"></canvas>
    <header class="header" >
        <img src="" alt="LOGO" class="company-logo">

        <div class="search-bar-container">
            <input type="text" placeholder="دنبال چی میگردید؟ سرچ کنید..." class="search-bar-input">
            <div class="search-bar-popup"></div>
            <img src="" alt="search-icon" class="search-icon">
        </div>

        <div class="shopping-cart">
            <img src="" alt="cart" class="cart-svg">
            <span class="add-to-cart">سبد خرید</span> <span class="cart-items-quantity">0</span>
        </div>  
    </header>
<div class="slider">
    <div class="banner-slider">
        <img src="" alt="banner-img" class="banner b1 active">
        <img src="" alt="banner-img" class="banner b2">
        <img src="" alt="banner-img" class="banner b3">
        <img src="" alt="banner-img" class="banner b4">
        <img src="" alt="banner-img" class="banner b5">
        </div>
        <div class="dots">
            <span class="dot active "></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot "></span>
    </div>
</div>
    <div class="products-hero">
        <div class=" product-hero-item"></div>
    </div>

    <div class="collectors first-collector">
        <img src="" alt="banner" class="first-collector-img">
    </div>

    <div class="pc-two-side">
        <strong class="product-title">کیس ها به دو دسته تقسیم میشوند</strong>
        <div class="pc-two-side-items"></div>
    </div>

    <div class="new-products">
        <strong class="product-title  new-products-title">محصولات جدید</strong>
        <div class=" new-products-items"></div>
    </div>

    <div class="collectors second-collector">
        <img src="" alt="sec-collector" class="second-collector-img">
    </div>

    <div class="custom-builds">
        <strong class="product-title  custom-builds-title">کیس های کاستوم شده</strong>
        <div class="custom-builds-items"></div>
    </div>

    <div class="collectors third-collector">
        <img src="" alt="third-collector" class="third-collector-img">
    </div>

    <div class="monitor-products">
        <strong class="product-title monitor-products-title">مانیتور های پرچم دار</strong>
        <div class=" monitor-products-items"></div>
    </div>

    <footer class="footer">
        <div class="footer-logo">
        <img src="" alt="LOGO" class="company-logo-footer">
        </div>
        <div class="slogan"><span class="slogan-item1">قدرت </span><span class="slogan-item2">آینده </span><span class="slogan-item3">تکنولوژی </span></div>
        <p class="footer-title">تکنولوژی برای امروز، قدرت برای فردا، آینده برای همیشه.</p>
        <p class="creator-name">ساخته شده با 🩷 توسط</p>
        <p class="creator-real-name" >Mr-Mmdzp</p>
    </footer>

    <script src="script.js" ></script>
</body>
</html>
